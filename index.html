<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상대방 심리 분석 & 갈등 해결 가이드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        soft: {
                            bg: '#F8F9FA',
                            card: '#FFFFFF',
                            primary: '#6C5CE7',
                            primaryHover: '#5B4BC4',
                            secondary: '#A8A4E6',
                            accent: '#FF7675',
                            text: '#2D3436',
                            muted: '#636E72',
                            border: '#E2E8F0'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #F3F4F6;
        }
        /* 로딩 스피너 애니메이션 */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6C5CE7;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-soft-text min-h-screen flex flex-col items-center p-4 sm:p-6">

    <!-- 메인 컨테이너 -->
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden my-auto border border-gray-100">
        
        <!-- 헤더 -->
        <header class="bg-gradient-to-r from-purple-500 to-indigo-600 p-6 text-white text-center relative">
            <h1 class="text-2xl sm:text-3xl font-bold mb-1"><i class="fa-solid fa-heart-pulse mr-2"></i>마음 번역기</h1>
            <p class="text-sm opacity-90 font-light">상대방의 속마음 분석부터 맞춤 카톡 답장까지</p>
        </header>

        <div class="p-6 space-y-6">

            <!-- 1단계: MBTI 및 관계 선택 -->
            <section class="space-y-4">
                <h2 class="text-lg font-bold flex items-center text-gray-800">
                    <span class="bg-indigo-100 text-indigo-600 w-6 h-6 rounded-full flex items-center justify-center text-xs mr-2">1</span>
                    상대방 정보 선택
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- 관계 선택 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">나와의 관계</label>
                        <select id="relationship" class="w-full p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-400 focus:outline-none text-sm bg-white">
                            <option value="연인/배우자">연인 / 배우자</option>
                            <option value="썸남/썸녀">썸남 / 썸녀</option>
                            <option value="친구">친구</option>
                            <option value="직장 동료/상사">직장 동료 / 상사</option>
                            <option value="가족">가족</option>
                            <option value="기타">기타 관계</option>
                        </select>
                    </div>

                    <!-- MBTI 선택 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">상대방 MBTI</label>
                        <select id="mbtiSelect" onchange="updateMbtiInfo()" class="w-full p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-400 focus:outline-none text-sm bg-white">
                            <option value="UNKNOWN">잘 모름 / 기타</option>
                            <option value="INTJ">INTJ</option><option value="INTP">INTP</option>
                            <option value="ENTJ">ENTJ</option><option value="ENTP">ENTP</option>
                            <option value="INFJ">INFJ</option><option value="INFP">INFP</option>
                            <option value="ENFJ">ENFJ</option><option value="ENFP">ENFP</option>
                            <option value="ISTJ">ISTJ</option><option value="ISFJ">ISFJ</option>
                            <option value="ESTJ">ESTJ</option><option value="ESFJ">ESFJ</option>
                            <option value="ISTP">ISTP</option><option value="ISFP">ISFP</option>
                            <option value="ESTP">ESTP</option><option value="ESFP">ESFP</option>
                        </select>
                    </div>
                </div>

                <!-- MBTI 특징 요약 카드가 표시되는 영역 -->
                <div id="mbtiInfoBox" class="p-4 bg-indigo-50/60 rounded-xl text-xs text-indigo-900 border border-indigo-100 transition-all">
                    <p class="font-semibold mb-1"><i class="fa-solid fa-circle-info mr-1"></i> 선택 안내</p>
                    <p class="text-gray-600">상대방의 MBTI를 고르면 갈등 상황에서의 성향 특징을 알려드립니다.</p>
                </div>
            </section>

            <!-- 2단계: 상황 및 행동 입력 -->
            <section class="space-y-4">
                <h2 class="text-lg font-bold flex items-center text-gray-800">
                    <span class="bg-indigo-100 text-indigo-600 w-6 h-6 rounded-full flex items-center justify-center text-xs mr-2">2</span>
                    상황 및 상대방의 행동 입력
                </h2>
                <div>
                    <textarea id="situationInput" rows="4" 
                        placeholder="예: 카톡 답장이 평소보다 3시간 이상 늦고 '어 그래'라고 짧게 왔어. 어제 약속 취소건 때문에 화난 것 같은데 정확히 말을 안 해줘." 
                        class="w-full p-3.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-400 focus:outline-none text-sm resize-none"></textarea>
                </div>

                <button onclick="analyzeSituation()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-medium py-3.5 rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> AI 속마음 분석하기
                </button>
            </section>

            <!-- 로딩 표시 -->
            <div id="loading" class="hidden flex-col items-center justify-center py-8 space-y-3">
                <div class="loader"></div>
                <p class="text-sm text-gray-500 font-medium">상대방의 속마음과 MBTI 특성을 분석하고 있습니다...</p>
            </div>

            <!-- 3단계: 분석 결과 출력 영역 -->
            <section id="resultArea" class="hidden space-y-6 pt-4 border-t border-gray-100">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-square-poll-vertical text-indigo-600"></i> AI 종합 분석 결과
                </h2>

                <!-- 1. 기분 & 분노 원인 -->
                <div class="bg-red-50/60 border border-red-100 p-4 rounded-xl">
                    <h3 class="text-sm font-bold text-red-700 mb-2 flex items-center">
                        <i class="fa-solid fa-face-frown mr-2"></i>현재 기분 및 분노 원인
                    </h3>
                    <p id="resEmotions" class="text-sm text-gray-700 leading-relaxed whitespace-pre-line"></p>
                </div>

                <!-- 2. 행동 이유 -->
                <div class="bg-amber-50/60 border border-amber-100 p-4 rounded-xl">
                    <h3 class="text-sm font-bold text-amber-700 mb-2 flex items-center">
                        <i class="fa-solid fa-brain mr-2"></i>상대방이 이렇게 행동하는 이유
                    </h3>
                    <p id="resReason" class="text-sm text-gray-700 leading-relaxed whitespace-pre-line"></p>
                </div>

                <!-- 3. 대처 가이드 -->
                <div class="bg-blue-50/60 border border-blue-100 p-4 rounded-xl">
                    <h3 class="text-sm font-bold text-blue-700 mb-2 flex items-center">
                        <i class="fa-solid fa-compass mr-2"></i>추천 대처 행동 및 마음가짐
                    </h3>
                    <p id="resGuide" class="text-sm text-gray-700 leading-relaxed whitespace-pre-line"></p>
                </div>

                <!-- 4. 카톡 답장 템플릿 3종 -->
                <div class="space-y-3">
                    <h3 class="text-sm font-bold text-gray-800 flex items-center">
                        <i class="fa-solid fa-comment-dots text-indigo-600 mr-2"></i>추천 카톡 답장 (클릭시 복사)
                    </h3>
                    
                    <!-- 공감형 -->
                    <div class="bg-gray-50 border border-gray-200 p-3.5 rounded-xl relative group">
                        <span class="text-[11px] font-bold bg-purple-100 text-purple-700 px-2 py-0.5 rounded mr-2">공감형</span>
                        <p id="replyEmpathy" class="text-sm text-gray-800 mt-2 pr-12"></p>
                        <button onclick="copyToClipboard('replyEmpathy')" class="absolute right-3 top-3 bg-white border border-gray-200 text-gray-600 hover:text-indigo-600 px-2.5 py-1 rounded-lg text-xs shadow-sm transition">
                            <i class="fa-regular fa-copy"></i> 복사
                        </button>
                    </div>

                    <!-- 해결형 -->
                    <div class="bg-gray-50 border border-gray-200 p-3.5 rounded-xl relative group">
                        <span class="text-[11px] font-bold bg-blue-100 text-blue-700 px-2 py-0.5 rounded mr-2">해결형</span>
                        <p id="replySolution" class="text-sm text-gray-800 mt-2 pr-12"></p>
                        <button onclick="copyToClipboard('replySolution')" class="absolute right-3 top-3 bg-white border border-gray-200 text-gray-600 hover:text-indigo-600 px-2.5 py-1 rounded-lg text-xs shadow-sm transition">
                            <i class="fa-regular fa-copy"></i> 복사
                        </button>
                    </div>

                    <!-- 유연형 -->
                    <div class="bg-gray-50 border border-gray-200 p-3.5 rounded-xl relative group">
                        <span class="text-[11px] font-bold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded mr-2">유연/부드러운형</span>
                        <p id="replyFlexible" class="text-sm text-gray-800 mt-2 pr-12"></p>
                        <button onclick="copyToClipboard('replyFlexible')" class="absolute right-3 top-3 bg-white border border-gray-200 text-gray-600 hover:text-indigo-600 px-2.5 py-1 rounded-lg text-xs shadow-sm transition">
                            <i class="fa-regular fa-copy"></i> 복사
                        </button>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        // 🔑 발급받은 Gemini API Key를 아래 따옴표 안(" ")에 넣어주세요.
        const GEMINI_API_KEY = 

        // MBTI 데이터베이스
        const mbtiData = {
            "INTJ": "논리적이고 신중함. 감정적인 비난보다는 원인 분석과 명확한 대안을 제시할 때 오해가 잘 풀립니다.",
            "INTP": "객관적이고 분석적. 회피하는 것처럼 보여도 혼자 생각할 시간이 필요할 수 있습니다.",
            "ENTJ": "직설적이고 솔직함. 문제의 핵심을 빠르게 짚고 결론을 원하므로 깔끔한 사과와 해결책이 좋습니다.",
            "ENTP": "논쟁을 즐기지만 뒤끝은 적음. 무엇에 대해 오해가 생겼는지 명확한 대화로 다가가는 것이 효과적입니다.",
            "INFJ": "속마음을 잘 드러내지 않음. 혼자 상처받아 참다가 관계를 정리할 수 있으니 진심 어린 공감이 필요합니다.",
            "INFP": "마음이 민감하고 상처받기 쉬움. 비판적인 태도는 피하고 상대의 감정을 최우선으로 존중해 주세요.",
            "ENFJ": "타인의 감정에 민감하고 배려심이 큼. 상대가 나 때문에 서운함을 느꼈다면 즉시 솔직한 마음을 전해보세요.",
            "ENFP": "감정이 풍부하고 솔직함. 서운함도 금방 표현하지만, 분위기를 밝게 전환하려는 진심에 잘 열립니다.",
            "ISTJ": "원칙과 책임감을 중시. 감정 호소보다는 어떤 점이 잘못되었고 어떻게 고칠지 명확히 설명해 주는 편이 좋습니다.",
            "ISFJ": "헌신적이고 상대의 서운함을 오랫동안 참아줌. 미안함과 고마움을 차분하게 전하면 마음이 누그러집니다.",
            "ESTJ": "체계적이고 현실적. 감정 싸움보다는 구체적으로 어떠한 상황이었는지 사실에 기반해 대화해야 합니다.",
            "ESFJ": "관계와 소통을 매우 중시. 답장이 늦어지거나 시큰둥해졌다면 관계의 온도를 높일 수 있는 다정한 메시지가 필요합니다.",
            "ISTP": "혼자만의 공간과 시간이 필수적. 억지로 대화를 강요하기보다 스스로 감정을 정돈할 시간을 주는 게 좋습니다.",
            "ISFP": "갈등을 매우 싫어하고 피함. 강요하지 않고 따뜻하고 부드럽게 마음을 물어봐 줄 때 마음을 엽니다.",
            "ESTP": "직관적이고 현실적. 길고 복잡한 감정 설명보다는 짧고 깔끔하게 문제점을 사과하고 넘어가는 것을 선호합니다.",
            "ESFP": "밝고 외향적이지만 서운함도 직관적으로 느낌. 진지하지만 너무 무겁지 않게 마음을 표현하면 금방 풀립니다.",
            "UNKNOWN": "기본 심리학 기반으로 접근합니다. 상대방의 현재 상황과 표현 방식에 초점을 맞추어 종합 분석합니다."
        };

        // MBTI 선택 시 요약 정보 업데이트
        function updateMbtiInfo() {
            const selected = document.getElementById("mbtiSelect").value;
            const infoBox = document.getElementById("mbtiInfoBox");
            if (mbtiData[selected]) {
                infoBox.innerHTML = `
                    <p class="font-semibold mb-1 text-indigo-950"><i class="fa-solid fa-paper-plane mr-1"></i> [${selected}] 갈등 패턴 요약</p>
                    <p class="text-gray-600">${mbtiData[selected]}</p>
                `;
            }
        }

        // Gemini API 호출 및 분석
        async function analyzeSituation() {
            const relationship = document.getElementById("relationship").value;
            const mbti = document.getElementById("mbtiSelect").value;
            const situation = document.getElementById("situationInput").value.trim();

            if (GEMINI_API_KEY === "YOUR_GEMINI_API_KEY" || !GEMINI_API_KEY) {
                alert("코드 내 GEMINI_API_KEY 변수에 본인의 API Key를 입력해주세요.");
                return;
            }
            if (!situation) {
                alert("상황 및 상대방의 행동을 입력해 주세요!");
                return;
            }

            // UI 제어
            document.getElementById("loading").classList.remove("hidden");
            document.getElementById("loading").classList.add("flex");
            document.getElementById("resultArea").classList.add("hidden");

            const promptText = `
너는 따뜻하고 전문적인 심리학자이자 인간관계 전문가야. 
아래 정보를 바탕으로 상대방의 심리를 정확히 분석하고 지침을 제공해 줘.

[입력 정보]
1. 나와의 관계: ${relationship}
2. 상대방 MBTI: ${mbti === 'UNKNOWN' ? '모름(일반 심리 기반)' : mbti}
3. 최근 상황 및 상대 행동: ${situation}

반드시 **유효한 JSON 형식**으로만 답변해 줘. 다른 설명이나 마크다운 백틱(\`\`\`json)은 절대로 포함하지 마.

{
  "emotions": "상대방의 현재 기분과 왜 화가 났거나 기분이 안 좋은지 원인 요약",
  "reason": "MBTI 특성과 종합적인 상황을 고려해 왜 이런 행동/말투를 보이는지 심리 분석",
  "guide": "내가 취해야 할 바람직한 행동 방식, 마음가짐, 대화 타이밍 가이드",
  "replyEmpathy": "상대 마음을 인정하고 공감해주는 카톡 답장 문장",
  "replySolution": "문제 원인을 짚고 대안을 제시하는 정중한 카톡 답장 문장",
  "replyFlexible": "부담 없이 분위기를 부드럽게 풀 수 있는 가벼운 카톡 답장 문장"
}
`;

            try {
                // Gemini API 호출 (gemini-2.5-flash)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 오류 (코드: ${response.status})`);
                }

                const data = await response.json();
                let resultText = data.candidates[0].content.parts[0].text;

                // JSON 변환 및 정제
                resultText = resultText.replace(/```json/g, "").replace(/```/g, "").trim();
                const parsedData = JSON.parse(resultText);

                // 결과 화면 표시
                document.getElementById("resEmotions").innerText = parsedData.emotions;
                document.getElementById("resReason").innerText = parsedData.reason;
                document.getElementById("resGuide").innerText = parsedData.guide;
                document.getElementById("replyEmpathy").innerText = parsedData.replyEmpathy;
                document.getElementById("replySolution").innerText = parsedData.replySolution;
                document.getElementById("replyFlexible").innerText = parsedData.replyFlexible;

                document.getElementById("resultArea").classList.remove("hidden");
                // 스크롤 이동
                document.getElementById("resultArea").scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                alert("분석 도중 오류가 발생했습니다. API 키나 네트워크 상태를 확인해주세요.\n(" + error.message + ")");
            } finally {
                document.getElementById("loading").classList.add("hidden");
                document.getElementById("loading").classList.remove("flex");
            }
        }

        // 클립보드 복사 함수
        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("답장이 클립보드에 복사되었습니다!");
            }).catch(err => {
                alert("복사에 실패했습니다.");
            });
        }
    </script>
</body>
</html>
